[project]
name = "beamter-bot"
version = "0.3.0"
description = "Cloud version of Beamter-Bot: multilingual RAG for German bureaucracy on Qdrant Cloud."
requires-python = ">=3.10"
# We add dependencies step by step, only when a file needs them.
dependencies = [
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "cryptography>=3.1",  # pypdf needs it to read AES-encrypted PDFs
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "qdrant-client>=1.10",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",  # the only heavy dependency (pulls in torch)
    "truststore>=0.9",  # lets the corpus downloader use the OS certificate store
    "fonttools>=4.0",  # pypdf uses it to decode some embedded fonts correctly
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx powers FastAPI's TestClient

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]  # expected: tests use in-memory Qdrant

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beamter"]
